services:
  worker:
    volumes:
      - ./worker:/app
    working_dir: /app
    command: dotnet watch run

  vote:
    volumes:
      - ./vote:/app

  result:
    environment:
      - NODE_ENV=development
    build:
      context: ./result
      dockerfile: Dockerfile.dev
    volumes:
      - ./result:/app
      - result_node_modules:/app/node_modules

volumes:
  result_node_modules:
